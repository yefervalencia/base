tasks.register('jacocoMergedReport', JacocoReport) {
    dependsOn subprojects.collect { it.tasks.named('test') }
    dependsOn subprojects.collect { it.tasks.named('jacocoTestReport') }
    additionalSourceDirs.setFrom files(subprojects*.sourceSets.main.allSource.srcDirs)
    sourceDirectories.setFrom files(subprojects*.sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom files(subprojects*.sourceSets.main.output)
    executionData.setFrom files(subprojects.collect { it.layout.buildDirectory.file('jacoco/test.exec') })
    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.required.set(true)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs = [
            '-Amapstruct.suppressGeneratorTimestamp=true'
    ]
}
tasks.named('wrapper') {
    gradleVersion = '8.2.1'
}
